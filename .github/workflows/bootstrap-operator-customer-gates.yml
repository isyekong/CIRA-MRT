name: Bootstrap operator customer-gate fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: operator-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bootstrap-and-validate:
    if: github.head_ref == 'agent/fix-operator-customer-gates'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Expand validated repair bundle
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode ci/operator-gate-fix-bundle.b64 > /tmp/operator-gate-fix.zip
          rm -rf /tmp/operator-gate-fix
          mkdir -p /tmp/operator-gate-fix
          unzip -q /tmp/operator-gate-fix.zip -d /tmp/operator-gate-fix

          install -D -m 0755 \
            /tmp/operator-gate-fix/cira-fix/tools/apply_operator_gate_fix.py \
            tools/apply_operator_gate_fix.py
          install -D -m 0755 \
            /tmp/operator-gate-fix/cira-fix/tools/validate_operator_outputs.py \
            tools/validate_operator_outputs.py
          install -D -m 0644 \
            /tmp/operator-gate-fix/cira-fix/tests/test_operator_customer_gates.py \
            tests/test_operator_customer_gates.py
          install -D -m 0644 \
            /tmp/operator-gate-fix/cira-fix/.github/workflows/validate-operator-customer-gates.yml \
            .github/workflows/validate-operator-customer-gates.yml

      - name: Apply strict operator ownership fix
        run: python tools/apply_operator_gate_fix.py

      - name: Replace bootstrap files with final repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f ci/operator-gate-fix-bundle.b64
          rm -f .github/workflows/bootstrap-operator-customer-gates.yml
          git status --short

      - name: Commit final repair to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
          else
            git commit -m 'fix: enforce operator downstream ownership'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run compile and unit tests
        run: |
          python -m py_compile mrt_cn_routes.py tools/validate_operator_outputs.py
          pytest -q

      - name: Generate sampled real IPv6 outputs
        run: |
          python mrt_cn_routes.py \
            --output-dir validation-dist \
            --cache-dir /tmp/cira-mrt-validation-cache \
            --sources routeviews \
            --collectors route-views6 \
            --max-files-per-source 1 \
            --parallel-downloads 2 \
            --parse-workers 2 \
            --timeout 240 \
            --parser native \
            --verbose

      - name: Validate sampled operator output
        run: |
          python tools/validate_operator_outputs.py \
            validation-dist \
            --baseline-dir dist \
            --report validation-report.json

      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-gate-validation
          path: |
            validation-dist/
            validation-report.json
          if-no-files-found: warn
          retention-days: 14
