name: Bootstrap operator customer-gate fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: operator-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bootstrap-and-validate:
    if: github.head_ref == 'agent/fix-operator-customer-gates'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Expand validated repair bundle
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode ci/operator-gate-fix-bundle.b64 > /tmp/operator-gate-fix.zip
          rm -rf /tmp/operator-gate-fix
          mkdir -p /tmp/operator-gate-fix
          unzip -q /tmp/operator-gate-fix.zip -d /tmp/operator-gate-fix

          install -D -m 0755 \
            /tmp/operator-gate-fix/cira-fix/tools/apply_operator_gate_fix.py \
            tools/apply_operator_gate_fix.py
          if [ ! -f tools/validate_operator_outputs.py ]; then
            install -D -m 0755 \
              /tmp/operator-gate-fix/cira-fix/tools/validate_operator_outputs.py \
              tools/validate_operator_outputs.py
          fi
          install -D -m 0644 \
            /tmp/operator-gate-fix/cira-fix/tests/test_operator_customer_gates.py \
            tests/test_operator_customer_gates.py

      - name: Apply strict operator ownership fix
        run: python tools/apply_operator_gate_fix.py

      - name: Repair compatibility block and assert strict test semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path("mrt_cn_routes.py")
          text = script.read_text(encoding="utf-8")
          function_start = text.index("def build_group_gates(")
          block_start = text.index('        family = group.get("family")\n', function_start)
          block_end_marker = "        gates[key] = spec\n"
          block_end = text.index(block_end_marker, block_start) + len(block_end_marker)
          replacement = "\n".join([
              '        family = group.get("family")',
              '        if family is None and not group.get("aggregate"):',
              '            candidate_families = {',
              '                OPERATOR_ANCHOR_FAMILY[asn]',
              '                for asn in group.get("asns", ())',
              '                if asn in OPERATOR_ANCHOR_FAMILY',
              '            }',
              '            if len(candidate_families) == 1:',
              '                family = next(iter(candidate_families))',
              '',
              '        spec = ({',
              '            "kind": kind,',
              '            "family": family,',
              '            "aggregate": bool(group.get("aggregate")),',
              '            "enabled": enabled,',
              '        } if gate_type in ("domestic_customer_cone", "customer_cone") else None)',
              '        gates[key] = spec',
              '',
          ])
          script.write_text(text[:block_start] + replacement + text[block_end:], encoding="utf-8")

          tests = Path("tests/test_filters.py")
          test_text = tests.read_text(encoding="utf-8")
          if "test_cone_gate_rejects_cn_origin_without_chain" not in test_text:
              raise SystemExit("strict CN-origin bypass rejection test is missing")
          if "test_cone_gate_includes_cn_origin_even_without_chain" in test_text:
              raise SystemExit("obsolete CN-origin bypass test is still present")
          PY

      - name: Commit source repair to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mrt_cn_routes.py README.md \
            tools/apply_operator_gate_fix.py \
            tools/validate_operator_outputs.py \
            tests/test_operator_customer_gates.py \
            tests/test_filters.py
          if git diff --cached --quiet; then
            echo 'Source repair was already committed'
          else
            git commit -m 'fix: enforce operator downstream ownership'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run compile and unit tests
        run: |
          python -m py_compile mrt_cn_routes.py tools/validate_operator_outputs.py
          pytest -q

      - name: Generate sampled real IPv6 outputs
        run: |
          python mrt_cn_routes.py \
            --output-dir validation-dist \
            --cache-dir /tmp/cira-mrt-validation-cache \
            --sources routeviews \
            --collectors route-views6 \
            --max-files-per-source 1 \
            --parallel-downloads 2 \
            --parse-workers 2 \
            --timeout 240 \
            --parser native \
            --verbose

      - name: Validate sampled operator output
        run: |
          python tools/validate_operator_outputs.py \
            validation-dist \
            --baseline-dir dist \
            --report validation-report.json

      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-gate-validation
          path: |
            validation-dist/
            validation-report.json
          if-no-files-found: warn
          retention-days: 14
